<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종목 정보 관리</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; margin: 1em; }
        .controls { margin-bottom: 1em; }
        .delete-btn { background-color: #ff4d4d; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 1em; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; border-top: 2px solid #333; }
        thead th { background-color: #f8f9fa; padding: 10px; border: 1px solid #ddd; }
        
        /* ✨ 1. 기본 정렬 설정: 모든 셀을 가운데 정렬 */
        tbody td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }

        /* ✨ 2. 예외 정렬 설정 */
        /* 가격 정보 (포착가, 현재가, 수익률)는 우측 정렬 */
        .price-info {
            text-align: right;
        }
        /* 분석 의견은 좌측 정렬 */
        .reason-cell {
            text-align: left;
            vertical-align: top;
            line-height: 1.6;
        }

        /* 각 종목 구분을 위한 하단 라인 */
        .stock-item-row-2 {
            border-bottom: 2px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>종목 정보 관리</h1>
    <h2>다음 갱신까지: <span id="countdown" style="color: blue;">30</span>초 <span id="status"></span></h2>

    <div class="controls">
        <button id="delete-selected-btn" class="delete-btn">선택 항목 삭제</button>
    </div>

    <table id="stock-table">
        <thead>
            <tr>
                <th style="width: 5%;"><input type="checkbox" id="select-all-checkbox"></th>
                <th style="width: 15%;">시간</th>
                <th style="width: 15%;">종목</th>
                <th style="width: 15%;">가격</th>
                <th style="width: 10%;">신호/수익률</th>
                <th style="width: 15%;">수급</th>
                <th style="width: 25%;">분석 의견</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <script>
        // ## URL 설정 ##
        const getWebhookUrl = 'https://workflow.i234.me:8808/webhook/api/stocks';
        const deleteWebhookUrl = 'https://workflow.i234.me:8808/webhook/api/stocks/delete-selecte';

        // (이하 JavaScript 로직은 길어서 일부 생략, 전체 코드는 아래에 있습니다)
        const countdownElement = document.getElementById('countdown');
        const statusElement = document.getElementById('status');
        const tableBody = document.querySelector('#stock-table tbody');
        let countdown = 30;

        function formatDateTime(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleString('ko-KR');
        }

        async function fetchData() {
            const checkedIds = new Set();
            document.querySelectorAll('.row-checkbox:checked').forEach(checkbox => {
                checkedIds.add(checkbox.dataset.id);
            });

            try {
                const response = await fetch(getWebhookUrl);
                const data = await response.json();
                
                tableBody.innerHTML = ''; 

                data.forEach(item => {
                    if (item && item.rowIndex) {
                        // 데이터 포맷팅
                        const firstPrice = item.firstPrice ? parseFloat(item.firstPrice).toLocaleString() : 'N/A';
                        const currentPrice = item.currentPrice ? parseFloat(item.currentPrice).toLocaleString() : 'N/A';
                        const performance = item.performance ? item.performance.toFixed(2) + '%' : 'N/A';
                        const personal = item.personal ? parseInt(item.personal).toLocaleString() : '0';
                        const foreign = item.foreign ? parseInt(item.foreign).toLocaleString() : '0';
                        const organ = item.organ ? parseInt(item.organ).toLocaleString() : '0';

                        // ✨ 3. 요청하신 레이아웃에 맞춰 HTML 구조 생성
                        const row1 = `
                            <tr class="stock-item-row-1">
                                <td rowspan="2">
                                    <input type="checkbox" class="row-checkbox" data-id="${item.rowIndex}">
                                </td>
                                <td>${formatDateTime(item.Date)}</td>
                                <td>${item.stockName}</td>
                                <td class="price-info">${firstPrice}</td>
                                <td>${item.signal || 'N/A'}</td>
                                <td>${personal}</td>
                                <td rowspan="2" class="reason-cell">${item.reason || '내용 없음'}</td>
                            </tr>
                        `;

                        const row2 = `
                            <tr class="stock-item-row-2">
                                <td>${formatDateTime(item.updateDate)}</td>
                                <td>${item.stockCode}</td>
                                <td class="price-info">${currentPrice}</td>
                                <td>${performance}</td>
                                <td>${foreign}<br>${organ}</td>
                            </tr>
                        `;

                        tableBody.innerHTML += row1 + row2;
                    }
                });

                if (checkedIds.size > 0) {
                    document.querySelectorAll('.row-checkbox').forEach(checkbox => {
                        if (checkedIds.has(checkbox.dataset.id)) {
                            checkbox.checked = true;
                        }
                    });
                }
            } catch (error) {
                console.error('데이터를 가져오는 데 실패했습니다:', error);
            }
        }
        
        // (이하 삭제, 체크박스, 카운트다운 함수는 이전과 동일)
        async function deleteSelected() { /* ... */ }
        document.getElementById('select-all-checkbox').addEventListener('change', function(event){ /* ... */ });
        document.getElementById('delete-selected-btn').addEventListener('click', deleteSelected);
        function startCountdown() { /* ... */ }
        
        // --- 아래는 생략된 함수들의 전체 코드입니다 ---
        async function deleteSelected() {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            const idsToDelete = Array.from(checkedBoxes).map(box => parseInt(box.getAttribute('data-id'))).filter(id => !isNaN(id) && id !== null);
            if (idsToDelete.length === 0) { alert('삭제할 항목을 먼저 선택해주세요.'); return; }
            if (!confirm(`총 ${idsToDelete.length}개의 항목을 정말로 삭제하시겠습니까?`)) { return; }
            try {
                const response = await fetch(deleteWebhookUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: idsToDelete }) });
                if (response.ok) { alert('삭제에 성공했습니다.'); fetchData(); } else { alert('삭제에 실패했습니다.'); }
            } catch (error) { console.error('삭제 요청 중 오류 발생:', error); }
        }
        document.getElementById('select-all-checkbox').addEventListener('change', function(event) {
            const isChecked = event.target.checked;
            document.querySelectorAll('.row-checkbox').forEach(box => box.checked = isChecked);
        });
        document.getElementById('delete-selected-btn').addEventListener('click', deleteSelected);
        function startCountdown() {
            setInterval(() => {
                const now = new Date();
                const hour = now.getHours();
                const minute = now.getMinutes();
                const isActiveTime = (hour > 8 || (hour === 8 && minute >= 30)) && hour < 20;
                if (isActiveTime) {
                    statusElement.textContent = '';
                    countdown--;
                    if (countdown <= 0) { fetchData(); countdown = 30; }
                } else {
                    statusElement.textContent = '(자동 갱신 비활성 시간)';
                    countdown = 30;
                }
                countdownElement.textContent = countdown;
            }, 1000);
        }

        fetchData();
        startCountdown();
    </script>
</body>
</html>
